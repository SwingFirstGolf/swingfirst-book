<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SwingFirst · Customers</title>
<style>
  :root {
    --bg:        #0f1117;
    --surface:   #181c27;
    --surface2:  #1f2435;
    --line:      #2a3045;
    --ink:       #e8eaf0;
    --ink-muted: #7b849a;
    --accent:    #4f8ef7;
    --accent-dk: #3a6fd4;
    --green:     #34c97e;
    --red:       #e05c5c;
    --gold:      #f5c842;
    --radius:    8px;
    --font:      -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 14px;
    min-height: 100vh;
  }

  /* ── Top nav ──────────────────────────────────────────────────── */
  .topnav {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 0 24px;
    height: 52px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topnav .logo {
    font-weight: 700;
    font-size: 16px;
    letter-spacing: .3px;
    color: var(--ink);
    text-decoration: none;
    white-space: nowrap;
  }
  .topnav .logo span { color: var(--accent); }
  .topnav nav { display: flex; gap: 4px; }
  .topnav nav a {
    color: var(--ink-muted);
    text-decoration: none;
    font-size: 13px;
    padding: 5px 12px;
    border-radius: 6px;
    transition: background .15s, color .15s;
  }
  .topnav nav a:hover { background: var(--surface2); color: var(--ink); }
  .topnav nav a.active { background: var(--surface2); color: var(--ink); }

  /* ── Page layout ─────────────────────────────────────────────── */
  .page {
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 24px 60px;
  }
  .page-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .page-header h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
  }
  .page-header .subtitle {
    font-size: 13px;
    color: var(--ink-muted);
    margin-top: 3px;
  }

  /* ── Controls bar ────────────────────────────────────────────── */
  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 420px;
  }
  .search-wrap svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    opacity: .45;
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    padding: 8px 12px 8px 34px;
    background: var(--surface2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--ink);
    font-size: 13px;
    outline: none;
    transition: border-color .15s;
  }
  .search-input::placeholder { color: var(--ink-muted); }
  .search-input:focus { border-color: var(--accent); }

  .count-badge {
    font-size: 13px;
    color: var(--ink-muted);
    white-space: nowrap;
    margin-left: auto;
  }
  .count-badge strong { color: var(--ink); }

  /* ── Table ───────────────────────────────────────────────────── */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead th {
    background: var(--surface2);
    padding: 11px 14px;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .7px;
    text-transform: uppercase;
    color: var(--ink-muted);
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
    user-select: none;
    cursor: pointer;
    position: relative;
    transition: color .12s, background .12s;
  }
  thead th:hover { color: var(--ink); background: #252a3a; }
  thead th.sort-asc,
  thead th.sort-desc { color: var(--ink); }

  /* Sort arrow widget inside each th */
  .sort-arrows {
    display: inline-flex;
    flex-direction: column;
    gap: 1px;
    margin-left: 6px;
    vertical-align: middle;
    line-height: 1;
    position: relative;
    top: -1px;
  }
  .sort-arrows .arr-up,
  .sort-arrows .arr-dn {
    display: block;
    width: 0; height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    opacity: .25;
    transition: opacity .12s, border-color .12s;
  }
  .sort-arrows .arr-up { border-bottom: 5px solid var(--ink-muted); }
  .sort-arrows .arr-dn { border-top:    5px solid var(--ink-muted); }

  /* Highlight the active arrow */
  thead th.sort-asc  .arr-up { opacity: 1; border-bottom-color: var(--accent); }
  thead th.sort-desc .arr-dn { opacity: 1; border-top-color:    var(--accent); }
  thead th.sort-asc  .arr-dn,
  thead th.sort-desc .arr-up { opacity: .15; }

  thead th:hover .arr-up,
  thead th:hover .arr-dn { opacity: .45; }

  tbody tr {
    border-bottom: 1px solid var(--line);
    transition: background .12s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }

  td {
    padding: 11px 14px;
    font-size: 13px;
    vertical-align: middle;
  }
  td.name { font-weight: 500; }
  td.email { color: var(--ink-muted); font-size: 12px; }
  td.phone { color: var(--ink-muted); font-size: 12px; }
  th.col-plays { text-align: right; }
  td.plays {
    font-weight: 600;
    font-size: 13px;
    text-align: right;
  }
  td.plays.high { color: var(--green); }
  td.plays.mid  { color: var(--accent); }
  td.plays.low  { color: var(--ink-muted); }
  td.date { color: var(--ink-muted); font-size: 12px; }
  td.id   { color: var(--ink-muted); font-size: 11px; }
  td.del-col, th.col-del { width: 60px; text-align: center; }
  .del-btn { background: none; border: none; color: var(--ink-muted); font-size: 13px; cursor: pointer; padding: 2px 6px; border-radius: 4px; opacity: .5; transition: opacity .12s, color .12s; }
  .del-btn:hover { opacity: 1; color: var(--red); }
  .del-confirm-btn { background: var(--red); color: #fff; border: none; border-radius: 4px; font-size: 11px; font-weight: 700; padding: 2px 8px; cursor: pointer; white-space: nowrap; }
  .del-cancel-btn  { background: none; border: 1px solid var(--line); border-radius: 4px; font-size: 11px; padding: 2px 6px; cursor: pointer; color: var(--ink-muted); margin-left: 3px; }
  tr.deleted-row { opacity: .35; pointer-events: none; }
  tbody tr { cursor: pointer; }
  td.del-col { cursor: default; }

  /* ── Edit modal ───────────────────────────────────────────────── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 500;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    width: 460px;
    max-width: calc(100vw - 32px);
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 24px 64px rgba(0,0,0,.5);
  }
  .cust-section-label { font-size: 10px; font-weight: 700; color: var(--ink-muted); text-transform: uppercase; letter-spacing: .07em; margin: 16px 0 8px; }
  .patterns-bar-row { display:flex;align-items:center;gap:8px;margin-bottom:5px }
  .patterns-bar-name { width:120px;font-size:11px;color:var(--ink-main,#e2e8f0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0 }
  .patterns-bar-track { flex:1;background:var(--line);border-radius:3px;height:8px;overflow:hidden }
  .patterns-bar-fill { height:100%;background:var(--accent);border-radius:3px }
  .patterns-bar-label { width:58px;font-size:11px;color:var(--ink-muted);text-align:right;flex-shrink:0 }
  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
  }
  .modal-title { font-size: 15px; font-weight: 700; color: var(--ink); }
  .modal-close { background: none; border: none; color: var(--ink-muted); font-size: 18px; cursor: pointer; line-height: 1; padding: 0 4px; }
  .modal-close:hover { color: var(--ink); }
  .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .modal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-field { display: flex; flex-direction: column; gap: 5px; }
  .modal-field.full { grid-column: 1 / -1; }
  .modal-label { font-size: 11px; font-weight: 600; color: var(--ink-muted); letter-spacing: .5px; text-transform: uppercase; }
  .modal-input {
    background: var(--surface2);
    border: 1px solid var(--line);
    border-radius: 7px;
    color: var(--ink);
    font-size: 13px;
    padding: 8px 11px;
    outline: none;
    font-family: var(--font);
    transition: border-color .15s;
  }
  .modal-input:focus { border-color: var(--accent); }
  .modal-input::placeholder { color: var(--ink-muted); opacity: .6; }
  .modal-foot {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--line);
    background: var(--surface2);
  }
  .modal-save {
    flex: 1; padding: 9px; background: var(--accent); color: #fff;
    border: none; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: background .15s;
  }
  .modal-save:hover:not(:disabled) { background: var(--accent-dk); }
  .modal-save:disabled { opacity: .5; cursor: default; }
  .modal-cancel {
    padding: 9px 16px; background: none; border: 1px solid var(--line);
    border-radius: 7px; color: var(--ink-muted); font-size: 13px; cursor: pointer;
  }
  .modal-cancel:hover { color: var(--ink); border-color: var(--ink-muted); }
  .modal-err { font-size: 12px; color: var(--red); margin-left: auto; }

  /* ── Pagination ───────────────────────────────────────────────── */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .page-info { font-size: 12px; color: var(--ink-muted); }
  .page-btns { display: flex; gap: 6px; align-items: center; }
  .page-btns button {
    padding: 6px 12px;
    background: var(--surface2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font-size: 12px;
    cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  .page-btns button:hover:not(:disabled) { background: var(--surface); border-color: var(--accent); color: var(--accent); }
  .page-btns button:disabled { opacity: .35; cursor: default; }
  .page-btns .cur-page {
    font-size: 12px;
    color: var(--ink-muted);
    padding: 6px 4px;
    min-width: 60px;
    text-align: center;
  }

  /* ── Per-page selector ───────────────────────────────────────── */
  .per-page-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--ink-muted);
  }
  .per-page-wrap select {
    background: var(--surface2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font-size: 12px;
    padding: 5px 8px;
    cursor: pointer;
    outline: none;
  }

  /* ── Loading / empty states ──────────────────────────────────── */
  .state-row td {
    text-align: center;
    padding: 40px;
    color: var(--ink-muted);
    font-size: 13px;
  }
  .spinner {
    display: inline-block;
    width: 20px; height: 20px;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Responsive ──────────────────────────────────────────────── */
  @media (max-width: 700px) {
    .topnav nav a span { display: none; }
    td.email, td.phone, td.date, td.id { display: none; }
    th.col-email, th.col-phone, th.col-date, th.col-id { display: none; }
  }
</style>
</head>
<body>

<!-- ── Nav ──────────────────────────────────────────────────────── -->
<nav class="topnav">
  <a class="logo" href="#">Swing<span>First</span></a>
  <nav>

    <a href="#" class="active">Customers</a>
    <a href="swingfirst-guide.html">Guide</a>
  </nav>
</nav>

<!-- ── Edit modal ───────────────────────────────────────────────── -->
<div class="modal-overlay" id="editOverlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="editModalTitle">Edit Customer</div>
      <button class="modal-close" onclick="closeEditModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-row">
        <div class="modal-field">
          <label class="modal-label">First Name</label>
          <input class="modal-input" id="editFirst" placeholder="First name" autocomplete="off"/>
        </div>
        <div class="modal-field">
          <label class="modal-label">Last Name</label>
          <input class="modal-input" id="editLast" placeholder="Last name" autocomplete="off"/>
        </div>
      </div>
      <div class="modal-field">
        <label class="modal-label">Email</label>
        <input class="modal-input" id="editEmail" type="email" placeholder="Email address" autocomplete="off"/>

      <div id="editPatternsSection" style="display:none">

</div>

<!-- ── Page ─────────────────────────────────────────────────────── -->
<div class="page">
  <div class="page-header">
    <div>
      <h1>Customers</h1>
      <div class="subtitle" id="subtitle">Loading…</div>
    </div>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input class="search-input" id="searchInput" type="text"
             placeholder="Search name, email, or phone…" autocomplete="off"/>
    </div>
    <div class="per-page-wrap">
      <label for="perPageSel">Rows</label>
      <select id="perPageSel">
        <option value="25">25</option>
        <option value="50" selected>50</option>
        <option value="100">100</option>
        <option value="250">250</option>
      </select>
    </div>
    <button id="gnFilterBtn" onclick="toggleGnFilter()" style="background:none;border:1px solid #fcd34d;border-radius:6px;padding:5px 12px;font-size:12px;font-weight:700;color:#92400e;cursor:pointer;opacity:.65;transition:all .12s" title="Show GolfNow bookers only">GN bookers</button>
    <div class="count-badge" id="countBadge"></div>
  </div>

  <div class="table-wrap">
    <table id="custTable">
      <thead>
        <tr>
          <th class="col-id"   data-col="q18_id"           data-dir="asc">ID<span class="sort-arrows"><span class="arr-up"></span><span class="arr-dn"></span></span></th>
          <th class="col-last" data-col="last_name"         data-dir="asc">Last Name<span class="sort-arrows"><span class="arr-up"></span><span class="arr-dn"></span></span></th>
          <th class="col-first"data-col="first_name"        data-dir="asc">First Name<span class="sort-arrows"><span class="arr-up"></span><span class="arr-dn"></span></span></th>
          <th class="col-email"data-col="email"             data-dir="asc">Email<span class="sort-arrows"><span class="arr-up"></span><span class="arr-dn"></span></span></th>
          <th class="col-phone"data-col="phone"             data-dir="asc">Phone<span class="sort-arrows"><span class="arr-up"></span><span class="arr-dn"></span></span></th>
          <th class="col-plays"data-col="reservation_count" data-dir="desc">Plays<span class="sort-arrows"><span class="arr-up"></span><span class="arr-dn"></span></span></th>
          <th class="col-date" data-col="q18_created_at"    data-dir="asc">Member Since<span class="sort-arrows"><span class="arr-up"></span><span class="arr-dn"></span></span></th>
          <th class="col-del"></th>
        </tr>
      </thead>
      <tbody id="custBody">
        <tr class="state-row"><td colspan="8"><span class="spinner"></span>Loading customers…</td></tr>
      </tbody>
    </table>
  </div>

  <div class="pagination">
    <div class="page-info" id="pageInfo"></div>
    <div class="page-btns">
      <button id="btnFirst" onclick="goPage(1)">« First</button>
      <button id="btnPrev"  onclick="goPage(curPage - 1)">‹ Prev</button>
      <span class="cur-page" id="curPageLabel"></span>
      <button id="btnNext"  onclick="goPage(curPage + 1)">Next ›</button>
      <button id="btnLast"  onclick="goPage(totalPages)">Last »</button>
    </div>
  </div>
</div>

<script>
// ─── Config ────────────────────────────────────────────────────────
const SB_URL = 'https://ojgxfeaesnaohskxdvam.supabase.co';
const SB_KEY = 'sb_publishable_4UVFMXQWGOt4XNgHVNzWoQ_Id6TBqcu';
const SB_H   = {
  'apikey': SB_KEY,
  'Authorization': 'Bearer ' + SB_KEY,
  'Prefer': 'count=exact'
};

// ─── State ─────────────────────────────────────────────────────────
let curPage    = 1;
let perPage    = 50;
let sortCol    = 'reservation_count';
let sortDir    = 'desc';
let searchVal  = '';
let gnOnly     = false;
let totalRows  = 0;
let totalPages = 1;
let debTimer   = null;

function toggleGnFilter() {
  gnOnly = !gnOnly;
  const btn = document.getElementById('gnFilterBtn');
  btn.style.opacity    = gnOnly ? '1'        : '.65';
  btn.style.background = gnOnly ? '#fef3c7'  : 'none';
  curPage = 1;
  fetchCustomers();
}

// ─── Fetch ─────────────────────────────────────────────────────────
async function fetchCustomers() {
  const body  = document.getElementById('custBody');
  body.innerHTML = `<tr class="state-row"><td colspan="8"><span class="spinner"></span>Loading…</td></tr>`;

  const offset = (curPage - 1) * perPage;
  const order  = `${sortCol}.${sortDir}`;

  let url = `${SB_URL}/rest/v1/q18_customers?select=q18_id,first_name,last_name,email,phone,reservation_count,q18_created_at,notes`
          + `&order=${encodeURIComponent(order)}`
          + `&limit=${perPage}&offset=${offset}`;

  // Only show players with at least 1 reservation (unless GN filter active — GN bookers can have 0)
  url += `&reservation_count=gte.${gnOnly ? 4 : 1}`;

  // GolfNow filter
  if (gnOnly) url += `&email=ilike.${encodeURIComponent('*@noreply-golfnow.com')}`;

  // Search filter
  const q = searchVal.trim();
  if (q) {
    const safe = q.replace(/[%_]/g, '\\$&');
    const pat  = `*${safe}*`;
    url += `&or=(last_name.ilike.${encodeURIComponent(pat)},first_name.ilike.${encodeURIComponent(pat)},email.ilike.${encodeURIComponent(pat)},phone.ilike.${encodeURIComponent(pat)})`;
  }

  try {
    const resp = await fetch(url, { headers: SB_H });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    // Parse total from Content-Range: 0-49/12345
    const cr = resp.headers.get('Content-Range');
    if (cr) {
      const m = cr.match(/\/(\d+)/);
      if (m) totalRows = parseInt(m[1], 10);
    }
    totalPages = Math.max(1, Math.ceil(totalRows / perPage));

    const data = await resp.json();
    renderTable(data);
    renderPagination();
    renderCountBadge();
  } catch (e) {
    body.innerHTML = `<tr class="state-row"><td colspan="8">Error loading data: ${e.message}</td></tr>`;
  }
}

// ─── Render table ──────────────────────────────────────────────────
function renderTable(rows) {
  const body = document.getElementById('custBody');
  if (!rows.length) {
    body.innerHTML = `<tr class="state-row"><td colspan="8">No customers found.</td></tr>`;
    return;
  }

  body.innerHTML = rows.map(r => {
    const plays    = r.reservation_count || 0;
    const playsClass = plays >= 20 ? 'high' : plays >= 5 ? 'mid' : 'low';
    const memberSince = r.q18_created_at
      ? new Date(r.q18_created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })
      : '—';
    const email = r.email || '—';
    const phone = r.phone || '—';
    const lastName  = escHtml(r.last_name  || '');
    const firstName = escHtml(r.first_name || '');

    const emailEsc = escHtml(r.email || '');
    const phoneRaw = r.phone || '';
    const phoneFmt = _fmtPhone(phoneRaw) || '';
    const phoneEsc = escHtml(phoneRaw);   // raw for modal input
    const phoneDsp = escHtml(phoneFmt);   // formatted for display
    const firstEsc = escHtml(r.first_name || '');
    const lastEsc  = escHtml(r.last_name  || '');
    const notesEsc = (r.notes || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    return `<tr data-q18id="${r.q18_id}" onclick="openEditModal(${r.q18_id}, '${firstEsc}', '${lastEsc}', '${emailEsc}', '${phoneEsc}', '${notesEsc}')">
      <td class="id">${r.q18_id}</td>
      <td class="name">${lastEsc}</td>
      <td class="name">${firstEsc}</td>
      <td class="email">${emailEsc || '<span style="color:var(--red);font-style:italic;opacity:.7">—</span>'}</td>
      <td class="phone">${phoneDsp || '<span style="color:var(--red);font-style:italic;opacity:.7">—</span>'}</td>
      <td class="plays ${playsClass}">${plays.toLocaleString()}</td>
      <td class="date">${memberSince}</td>
      <td class="del-col" onclick="event.stopPropagation()"><button class="del-btn" title="Delete record" onclick="initDelete(this, ${r.q18_id}, '${lastEsc}, ${firstEsc}')">🗑</button></td>
    </tr>`;
  }).join('');
}

function _fmtPhone(raw) {
  if (!raw) return null;
  const digits = String(raw).replace(/\D/g, '');
  if (digits.length === 10)
    return `+1 (${digits.slice(0,3)}) ${digits.slice(3,6)}-${digits.slice(6)}`;
  if (digits.length === 11 && digits[0] === '1')
    return `+1 (${digits.slice(1,4)}) ${digits.slice(4,7)}-${digits.slice(7)}`;
  if (digits.length > 6) return `+${digits}`;
  return raw;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Render pagination ─────────────────────────────────────────────
function renderPagination() {
  const start = totalRows === 0 ? 0 : (curPage - 1) * perPage + 1;
  const end   = Math.min(curPage * perPage, totalRows);
  document.getElementById('pageInfo').textContent =
    totalRows > 0 ? `Showing ${start.toLocaleString()}–${end.toLocaleString()}` : '';
  document.getElementById('curPageLabel').textContent =
    totalRows > 0 ? `Page ${curPage} of ${totalPages.toLocaleString()}` : '';
  document.getElementById('btnFirst').disabled = curPage <= 1;
  document.getElementById('btnPrev').disabled  = curPage <= 1;
  document.getElementById('btnNext').disabled  = curPage >= totalPages;
  document.getElementById('btnLast').disabled  = curPage >= totalPages;
}

function renderCountBadge() {
  const badge = document.getElementById('countBadge');
  const sub   = document.getElementById('subtitle');
  const q = searchVal.trim();
  if (q) {
    badge.innerHTML = `<strong>${totalRows.toLocaleString()}</strong> result${totalRows !== 1 ? 's' : ''} for "${escHtml(q)}"`;
    sub.textContent = 'Filtered view';
  } else {
    badge.innerHTML = `<strong>${totalRows.toLocaleString()}</strong> players`;
    sub.textContent = `${totalRows.toLocaleString()} players with at least one round`;
  }
}

// ─── Sorting ───────────────────────────────────────────────────────
document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) {
      sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      sortCol = col;
      sortDir = th.dataset.dir || 'asc';
    }
    curPage = 1;
    updateSortHeaders();
    fetchCustomers();
  });
});

function updateSortHeaders() {
  document.querySelectorAll('thead th[data-col]').forEach(th => {
    th.classList.remove('sort-asc', 'sort-desc');
    if (th.dataset.col === sortCol) {
      th.classList.add(sortDir === 'asc' ? 'sort-asc' : 'sort-desc');
    }
  });
}

// ─── Search ────────────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(debTimer);
  debTimer = setTimeout(() => {
    searchVal = e.target.value;
    curPage   = 1;
    fetchCustomers();
  }, 350);
});

// ─── Per-page ─────────────────────────────────────────────────────
document.getElementById('perPageSel').addEventListener('change', e => {
  perPage = parseInt(e.target.value, 10);
  curPage = 1;
  fetchCustomers();
});

// ─── Pagination nav ────────────────────────────────────────────────
function goPage(n) {
  n = Math.max(1, Math.min(n, totalPages));
  if (n === curPage) return;
  curPage = n;
  fetchCustomers();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── Edit modal ────────────────────────────────────────────────────
let _editQ18Id = null;

function openEditModal(q18Id, firstName, lastName, email, phone, notes) {
  _editQ18Id = q18Id;
  document.getElementById('editModalTitle').textContent = lastName && firstName
    ? `Edit — ${lastName}, ${firstName}`
    : `Edit Customer`;
  document.getElementById('editFirst').value = firstName || '';
  document.getElementById('editLast').value  = lastName  || '';
  document.getElementById('editEmail').value = email     || '';
  document.getElementById('editPhone').value = phone     || '';
  document.getElementById('editNotes').value = notes     || '';
  document.getElementById('editErr').textContent = '';
  document.getElementById('editSaveBtn').disabled = false;
  document.getElementById('editSaveBtn').textContent = 'Save';
  document.getElementById('editOverlay').classList.add('open');
  // Show play patterns section and load data
  const patternsSection = document.getElementById('editPatternsSection');
  const patternsContent = document.getElementById('editPatternsContent');
  patternsSection.style.display = 'block';
  patternsContent.innerHTML = '<span style="color:var(--ink-muted);font-style:italic">Loading play patterns…</span>';
  loadPlayPatterns(firstName, lastName);
  setTimeout(() => document.getElementById('editFirst').focus(), 50);
}

async function loadPlayPatterns(firstName, lastName) {
  const cleanName = `${firstName} ${lastName}`.replace(/\*/g, '').trim();
  const patternsContent = document.getElementById('editPatternsContent');
  try {
    // Build fuzzy pattern: "Sharon% Wilson" matches both "Sharon Wilson" and "Sharon* Wilson"
    const _pp = cleanName.split(/\s+/);
    const bpPat = _pp.length >= 2
      ? `${_pp.slice(0, -1).join(' ')}% ${_pp[_pp.length - 1]}`
      : `%${cleanName}%`;
    const url = `${SB_URL}/rest/v1/booking_players?name=ilike.${encodeURIComponent(bpPat)}` +
      `&select=name,bookings(tee_times(date,hour,minute,courses(name,slug)))&limit=500`;
    const rows = await fetch(url, { headers: SB_H }).then(r => r.json());

    // Deduplicate by date|hour|minute|course (same logic as tee sheet drawer)
    const seen = new Set();
    const history = (rows || []).map(row => {
      const tt = row.bookings?.tee_times;
      return { date: tt?.date, hour: tt?.hour, minute: tt?.minute,
               course: tt?.courses?.name || 'Unknown', courseSlug: tt?.courses?.slug || '' };
    }).filter(h => {
      if (!h.date) return false;
      const k = `${h.date}|${h.hour}|${h.minute}|${h.courseSlug}`;
      if (seen.has(k)) return false;
      seen.add(k); return true;
    });

    if (history.length === 0) {
      patternsContent.innerHTML = '<span style="font-style:italic;color:var(--ink-muted)">No booking history in current system yet — pattern data will accumulate as they continue to play.</span>';
      return;
    }

    // Per-course counts
    const courseMap = {};
    history.forEach(h => {
      const k = h.courseSlug || 'other';
      if (!courseMap[k]) courseMap[k] = { name: h.course, count: 0 };
      courseMap[k].count++;
    });
    const courses = Object.values(courseMap).sort((a, b) => b.count - a.count);
    const topCount = courses[0].count;

    // Day-of-week counts
    const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const dowCounts = [0,0,0,0,0,0,0];
    history.forEach(h => { if (h.date) dowCounts[new Date(h.date + 'T12:00:00').getDay()]++; });
    const dowMax = Math.max(...dowCounts, 1);

    // Morning / Afternoon
    let morning = 0, afternoon = 0;
    history.forEach(h => { if (h.hour != null) { if (h.hour < 12) morning++; else afternoon++; } });
    const timeTotal = morning + afternoon || 1;
    const mPct = Math.round((morning / timeTotal) * 100);
    const aPct = 100 - mPct;

    // Render
    const courseHtml = courses.map(c => {
      const pct = Math.round((c.count / history.length) * 100);
      const barW = Math.round((c.count / topCount) * 100);
      return `<div class="patterns-bar-row">
        <div class="patterns-bar-name">${escHtml(c.name)}</div>
        <div class="patterns-bar-track"><div class="patterns-bar-fill" style="width:${barW}%"></div></div>
        <div class="patterns-bar-label">${c.count} (${pct}%)</div>
      </div>`;
    }).join('');

    const dowHtml = dowCounts.map((cnt, i) => {
      const h = Math.max(4, Math.round((cnt / dowMax) * 36));
      const wknd = i === 0 || i === 6;
      return `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex:1">
        <div style="font-size:9px;color:var(--ink-muted)">${cnt || ''}</div>
        <div style="height:${h}px;width:100%;background:${wknd ? 'var(--accent)' : '#2d5a3a'};border-radius:2px 2px 0 0"></div>
        <div style="font-size:9px;color:${wknd ? 'var(--accent)' : 'var(--ink-muted)'};font-weight:${wknd ? '700' : '400'}">${DAYS[i]}</div>
      </div>`;
    }).join('');

    patternsContent.innerHTML = `
      <div style="font-size:11px;color:var(--ink-muted);margin-bottom:8px">${history.length} bookings on record</div>
      ${courseHtml}
      <div style="margin-top:10px;margin-bottom:4px;font-size:10px;font-weight:600;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.05em">Day of Week</div>
      <div style="display:flex;gap:3px;align-items:flex-end;height:52px;margin-bottom:10px">${dowHtml}</div>
      <div style="font-size:10px;font-weight:600;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px">Tee Time Preference</div>
      <div style="display:flex;border-radius:5px;overflow:hidden;height:18px;gap:1px">
        ${mPct > 0 ? `<div style="flex:${mPct};background:var(--accent);display:flex;align-items:center;justify-content:center"><span style="font-size:10px;color:#fff;font-weight:600">☀ Morning ${mPct}%</span></div>` : ''}
        ${aPct > 0 ? `<div style="flex:${aPct};background:#2d5a3a;display:flex;align-items:center;justify-content:center"><span style="font-size:10px;color:#a7f3d0;font-weight:600">🌅 Afternoon ${aPct}%</span></div>` : ''}
      </div>`;
  } catch(e) {
    patternsContent.innerHTML = '<span style="color:var(--ink-muted);font-style:italic">Could not load play patterns.</span>';
  }
}

function closeEditModal() {
  document.getElementById('editOverlay').classList.remove('open');
  document.getElementById('editPatternsSection').style.display = 'none';
  _editQ18Id = null;
}

async function saveEdit() {
  if (!_editQ18Id) return;
  const first = document.getElementById('editFirst').value.trim();
  const last  = document.getElementById('editLast').value.trim();
  const email = document.getElementById('editEmail').value.trim();
  const phone = document.getElementById('editPhone').value.trim();
  const notes = document.getElementById('editNotes').value.trim();
  const errEl = document.getElementById('editErr');
  const btn   = document.getElementById('editSaveBtn');

  if (!first || !last) { errEl.textContent = 'First and last name required.'; return; }
  errEl.textContent = '';
  btn.textContent = 'Saving…';
  btn.disabled = true;

  try {
    const resp = await fetch(`${SB_URL}/rest/v1/q18_customers?q18_id=eq.${_editQ18Id}`, {
      method: 'PATCH',
      headers: Object.assign({}, SB_H, { 'Content-Type': 'application/json', 'Prefer': 'return=representation' }),
      body: JSON.stringify({ first_name: first, last_name: last, email: email || null, phone: phone || null, notes: notes || null })
    });
    if (!resp.ok) throw new Error(await resp.text());

    // Update the row in the table without a full reload
    const row = document.querySelector(`tr[data-q18id="${_editQ18Id}"]`);
    if (row) {
      row.cells[1].textContent = last;
      row.cells[2].textContent = first;
      row.cells[3].innerHTML = escHtml(email) || '<span style="color:var(--red);font-style:italic;opacity:.7">—</span>';
      const phoneFmtSave = escHtml(_fmtPhone(phone) || phone);
      row.cells[4].innerHTML = phoneFmtSave || '<span style="color:var(--red);font-style:italic;opacity:.7">—</span>';
      // Update onclick with raw values (phone raw, notes raw)
      const esc = s => s.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
      row.setAttribute('onclick', `openEditModal(${_editQ18Id}, '${esc(first)}', '${esc(last)}', '${esc(email)}', '${esc(phone)}', '${esc(notes)}')`);
    }
    closeEditModal();
  } catch(e) {
    errEl.textContent = 'Save failed: ' + e.message;
    btn.textContent = 'Save';
    btn.disabled = false;
  }
}

// Close modal on overlay click
document.getElementById('editOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('editOverlay')) closeEditModal();
});
// Close on Escape
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeEditModal(); });

// ─── Init ──────────────────────────────────────────────────────────
updateSortHeaders();
fetchCustomers();

// ─── Delete ────────────────────────────────────────────────────────
function initDelete(btn, q18Id, displayName) {
  // Replace the 🗑 button with inline "Sure? / ×" confirmation
  const cell = btn.parentElement;
  cell.innerHTML =
    `<button class="del-confirm-btn" onclick="doDelete(this, ${q18Id})">Sure?</button>` +
    `<button class="del-cancel-btn"  onclick="cancelDelete(this)">×</button>`;
}

function cancelDelete(btn) {
  const cell = btn.parentElement;
  const q18Id = cell.closest('tr').dataset.q18id;
  cell.innerHTML = `<button class="del-btn" title="Delete record" onclick="initDelete(this, ${q18Id}, '')">🗑</button>`;
}

async function doDelete(btn, q18Id) {
  btn.textContent = '…';
  btn.disabled = true;
  try {
    const resp = await fetch(`${SB_URL}/rest/v1/q18_customers?q18_id=eq.${q18Id}`, {
      method: 'DELETE',
      headers: SB_H
    });
    if (!resp.ok) throw new Error(await resp.text());
    const row = btn.closest('tr');
    row.classList.add('deleted-row');
    setTimeout(() => row.remove(), 600);
  } catch(e) {
    btn.textContent = 'Sure?';
    btn.disabled = false;
    alert('Delete failed: ' + e.message);
  }
}
